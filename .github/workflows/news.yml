name: Νέα Taxheaven
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/fetch_news.py, .github/workflows/news.yml]
permissions:
  contents: write
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fetch_news.py
      - name: Αποθήκευση αν άλλαξε
        run: |
          git config user.name "acbo-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add news.json deadlines.json 2>/dev/null || git add news.json
          git diff --cached --quiet || (git commit -m "Ενημέρωση νέων και προθεσμιών Taxheaven" && git push)
